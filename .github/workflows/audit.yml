name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check the locked dependencies for advisories
        run: cargo audit
