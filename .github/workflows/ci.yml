name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".editorconfig"
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the test suites
        # Release mode: the fixtures are large and the glossary suite is far slower in a debug build.
        run: cargo test --locked --release
